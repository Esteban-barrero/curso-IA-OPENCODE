<!DOCTYPE html>
<!--
  ============================================================
  DIARIO DE ESTUDIO - index.html
  ============================================================
  Este es el archivo que ABRE el navegador (se abre con doble clic).
  Aquí solo está la ESTRUCTURA de la página (el esqueleto visible):
  el encabezado, la portada con la racha, el formulario y la lista.

  No hay lógica aquí. La lógica (guardar, calcular la racha, etc.)
  vive en app.js, y el diseño (colores, tamaños) en styles.css.
  ============================================================
-->
<html lang="es">
<head>
  <!--
    charset="UTF-8": permite acentos, ñ y emojis.
    viewport: hace que la página se vea bien en el móvil
    (sin esto, el celular mostraría la web diminuta).
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diario de Estudio</title>

  <!-- Enlazamos la hoja de estilos (el diseño visual). -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Contenedor principal: centra todo y le da márgenes. -->
  <main class="contenedor">

    <!-- ====== ENCABEZADO ====== -->
    <header class="cabecera">
      <h1>Diario de Estudio</h1>
      <p class="subtitulo">Anota lo que estudias y cuida tu racha</p>
    </header>

    <!--
      ====== PORTADA: LA RACHA ======
      Es el elemento protagonista. Muestra el número de días seguidos
      y una "cadena" con un cuadro por cada día.
      Los <span> con id los rellena JavaScript.
    -->
    <section class="portada" aria-label="Racha actual">
      <p class="portada-pista">Racha actual</p>

      <div class="portada-linea">
        <span class="portada-numero" id="racha">0</span>
        <span class="portada-dias">días seguidos</span>
      </div>

      <!-- Cadena de los últimos 7 días: JavaScript llena los cuadros. -->
      <div class="cadena" id="cadena" aria-label="Últimos 7 días de estudio"></div>

      <!--
        Marcadores: los tres datos de resumen.
        Usamos <dl> porque son "etiqueta -> valor".
      -->
      <dl class="marcadores">
        <div class="marcador">
          <dt>Mejor racha</dt>
          <dd><span id="mejor-racha">0</span> días</dd>
        </div>
        <div class="marcador">
          <dt>Esta semana</dt>
          <dd><span id="minutos-semana">0</span> min</dd>
        </div>
        <div class="marcador">
          <dt>Días este mes</dt>
          <dd><span id="dias-mes">0</span></dd>
        </div>
      </dl>
    </section>

    <!--
      ====== MAPA DE CALOR ======
      Muestra las últimas 16 semanas (lunes a domingo). Cada cuadrito
      es un día; cuanto más minutos, más intenso el verde.
      JavaScript rellena la cuadrícula (id="mapa-calor") y la leyenda.
    -->
    <section class="panel panel-mapa">
      <h2>Mapa de estudio</h2>

      <!-- Contenedor desplazable: en móvil se puede arrastrar. -->
      <div class="mapa-scroll">
        <!-- La cuadrícula de semanas/días la llena JavaScript. -->
        <div class="mapa-calor" id="mapa-calor" aria-label="Mapa de calor de estudio"></div>
      </div>

      <!-- Leyenda: explica la escala de color "menos / más". -->
      <div class="leyenda">
        <span class="leyenda-texto">menos</span>
        <span class="leyenda-cuadro nivel-0"></span>
        <span class="leyenda-cuadro nivel-1"></span>
        <span class="leyenda-cuadro nivel-2"></span>
        <span class="leyenda-cuadro nivel-3"></span>
        <span class="leyenda-cuadro nivel-4"></span>
        <span class="leyenda-texto">más</span>
      </div>
    </section>

    <!--
      ====== FORMULARIO PARA REGISTRAR UNA SESIÓN ======
      Cuando el usuario lo envíe, JavaScript escuchará el evento "submit".
    -->
    <section class="panel">
      <h2>Nueva sesión</h2>

      <form id="formulario">
        <!-- Campo 1: FECHA (viene rellena con HOY, pero se puede cambiar) -->
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required />
        </div>

        <!-- Campo 2: TEMA (texto obligatorio, ej: "JavaScript") -->
        <div class="campo">
          <label for="tema">Tema</label>
          <input
            type="text"
            id="tema"
            placeholder="Ej: Funciones en JavaScript"
            required
          />
        </div>

        <!-- Campo 3: MINUTOS (número entero mayor que 0) -->
        <div class="campo">
          <label for="minutos">Minutos</label>
          <input
            type="number"
            id="minutos"
            min="1"
            placeholder="Ej: 45"
            required
          />
        </div>

        <!-- Botón que dispara el envío del formulario -->
        <button type="submit" class="boton">Guardar sesión</button>
      </form>
    </section>

    <!--
      ====== LISTA DE SESIONES ======
      JavaScript insertará aquí cada sesión guardada, de la más
      reciente a la más antigua. Empieza vacía (<ul> sin <li>).
    -->
    <section class="panel">
      <h2>Mis sesiones</h2>
      <!-- id="lista" => JavaScript la busca por este id para llenarla -->
      <ul id="lista" class="lista-sesiones"></ul>
      <!-- Mensaje que se muestra cuando todavía no hay ninguna sesión -->
      <p id="mensaje-vacio" class="mensaje-vacio">
        Aún no hay sesiones registradas. La primera empieza ahora.
      </p>
    </section>

  </main>

  <!--
    Cargamos los scripts EN ESTE ORDEN:
      1) logica.js  -> funciones puras (sin DOM), deben existir primero.
      2) mapa.js    -> interfaz del mapa (usa las funciones de logica.js).
      3) app.js     -> arranque y resto de la interfaz; llama a pintarMapa().
  -->
  <script src="logica.js"></script>
  <script src="mapa.js"></script>
  <script src="app.js"></script>
</body>
</html>
